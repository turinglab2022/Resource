<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>브라우저 WebSocket 최소 예제</title>
</head>
<body>
  <!-- 파일을 더블클릭해서 브라우저로 열어도 동작한다. (먼저 에코 서버 실행) -->
  <h3>WebSocket 에코 테스트</h3>
  <input id="msg" placeholder="메시지" />
  <button id="send">보내기</button>
  <pre id="log"></pre>

  <script>
    const log = (t) => (document.getElementById('log').textContent += t + '\n');

    // 1) 연결 생성 — 이 순간 브라우저가 HTTP Upgrade 요청을 보낸다.
    const ws = new WebSocket('ws://localhost:8080');

    // 2) 이벤트 기반: 콜백으로 상태 변화를 받는다.
    ws.onopen    = () => log('✅ 연결됨');
    ws.onmessage = (e) => log('📩 ' + e.data);
    ws.onclose   = (e) => log('❌ 종료 (code=' + e.code + ')');
    ws.onerror   = () => log('⚠️ 오류');

    // 3) 전송은 OPEN 상태에서만 가능
    document.getElementById('send').onclick = () => {
      const input = document.getElementById('msg');
      if (ws.readyState === WebSocket.OPEN && input.value) {
        ws.send(input.value);
        input.value = '';
      }
    };
  </script>
</body>
</html>
